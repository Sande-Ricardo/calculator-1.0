<aside class="sidebar-wrapper" [class.collapsed]="!isOpen">
  <!-- Toggle Bar -->
  <div class="sidebar-toggle-header">
    <button class="toggle-btn" (click)="toggleSidebar()" [title]="'CONVERTER.SIDEBAR.TOGGLE_TITLE' | translate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [class.rotated]="!isOpen">
        <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
      </svg>
      <span *ngIf="isOpen">{{ 'CONVERTER.SIDEBAR.TOOLBOX_TITLE' | translate }}</span>
    </button>
  </div>

  <div class="sidebar-content" *ngIf="isOpen">
    <!-- Tabs Navigation -->
    <div class="sidebar-tabs">
      <button class="tab-btn" [class.active]="activeTab === 'dimensional'" (click)="setTab('dimensional')" [title]="'CONVERTER.SIDEBAR.TAB_DIMENSIONAL_TITLE' | translate">
        {{ 'CONVERTER.SIDEBAR.TAB_DIMENSIONAL' | translate }}
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'constants'" (click)="setTab('constants')" [title]="'CONVERTER.SIDEBAR.TAB_CONSTANTS_TITLE' | translate">
        {{ 'CONVERTER.SIDEBAR.TAB_CONSTANTS' | translate }}
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'prefixes'" (click)="setTab('prefixes')" [title]="'CONVERTER.SIDEBAR.TAB_PREFIXES_TITLE' | translate">
        {{ 'CONVERTER.SIDEBAR.TAB_PREFIXES' | translate }}
      </button>
      <button class="tab-btn" [class.active]="activeTab === 'favorites'" (click)="setTab('favorites')" [title]="'CONVERTER.SIDEBAR.TAB_FAVORITES_TITLE' | translate">
        {{ 'CONVERTER.SIDEBAR.TAB_FAVORITES' | translate }}
      </button>
    </div>

    <!-- Active Tab Panel -->
    <div class="tab-panel">
      <app-dimensional-inspector *ngIf="activeTab === 'dimensional'" [magnitude]="magnitude" [magnitudeKey]="magnitudeKey"></app-dimensional-inspector>

      <app-physical-constants *ngIf="activeTab === 'constants'" (injectConstant)="onInjectConstant($event)"></app-physical-constants>

      <app-si-prefixes *ngIf="activeTab === 'prefixes'"></app-si-prefixes>

      <app-favorites *ngIf="activeTab === 'favorites'" (applyFavorite)="onApplyFavorite($event)"></app-favorites>
    </div>
  </div>
</aside>
