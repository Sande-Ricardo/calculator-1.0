<div class="sidebar crystal-box">
  <div class="logo-container">
    <img src="assets/img/logo-w.png" alt="Calculato Logo" class="brand-logo" />
  </div>
  <div class="menu-items">
    
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="menu-item" title="Standard Calculator">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
          <line x1="9" y1="22" x2="15" y2="22"/>
          <line x1="8" y1="6" x2="16" y2="6"/>
          <circle cx="8" cy="11" r="1"/>
          <circle cx="12" cy="11" r="1"/>
          <circle cx="16" cy="11" r="1"/>
          <circle cx="8" cy="15" r="1"/>
          <circle cx="12" cy="15" r="1"/>
          <circle cx="16" cy="15" r="1"/>
          <circle cx="8" cy="19" r="1"/>
          <circle cx="12" cy="19" r="1"/>
          <circle cx="16" cy="19" r="1"/>
        </svg>
      </div>
      <span class="menu-text">Calculator</span>
    </a>

    <a routerLink="/equation" routerLinkActive="active" class="menu-item" title="Equation Solver">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="5" y1="9" x2="19" y2="9" />
          <line x1="5" y1="15" x2="19" y2="15" />
        </svg>
      </div>
      <span class="menu-text">Equations</span>
    </a>

    <a routerLink="/graph" routerLinkActive="active" class="menu-item" title="Graphing">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
        </svg>
      </div>
      <span class="menu-text">Graphing</span>
    </a>

    <a routerLink="/derivate" routerLinkActive="active" class="menu-item" title="Derivatives">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14"/>
          <!-- Little tick mark for prime -->
          <path d="M14 6l2-2" stroke-width="2.5"/>
        </svg>
      </div>
      <span class="menu-text">Derivatives</span>
    </a>

    <a routerLink="/integrate" routerLinkActive="active" class="menu-item" title="Integrals">
      <div class="icon-wrapper">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <path d="M14.5 5c0-1.5-1.5-2.5-3-2.5S8.5 3.8 8.5 5.5v13c0 1.7 1.5 3 3 3s3-1 3-2.5"/>
        </svg>
      </div>
      <span class="menu-text">Integrals</span>
    </a>

  </div>
</div>
