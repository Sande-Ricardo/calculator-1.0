<div class="image-block-container" *ngIf="content">
  <div class="img-wrapper">
    <img [src]="content" [alt]="metadata?.caption || 'Course Image'" class="course-image" />
  </div>
  <div class="image-caption" *ngIf="metadata?.caption">
    {{ metadata.caption }}
  </div>
</div>

<div class="image-placeholder-container" *ngIf="!content">
  <div class="placeholder-icon">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
  </div>
  <p class="placeholder-text">No image URL configured</p>
</div>
