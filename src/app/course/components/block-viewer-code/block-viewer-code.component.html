<div class="code-block-container">
  <div class="code-header">
    <div class="lang-badge">{{ metadata?.language || 'python' }}</div>
    <button class="copy-btn" (click)="copyToClipboard()" [class.copied]="isCopied">
      <svg *ngIf="!isCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      <svg *ngIf="isCopied" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span>{{ isCopied ? 'Copied!' : 'Copy' }}</span>
    </button>
  </div>
  <pre><code #codeElement></code></pre>
</div>
