<div class="graph-block-wrapper">
  <!-- Title / Description -->
  <div class="graph-header" *ngIf="metadata?.title">
    <div class="graph-title-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
    </div>
    <h3 class="graph-title">{{ metadata.title }}</h3>
  </div>

  <!-- Loading State -->
  <div class="graph-loading" *ngIf="isLoading">
    <div class="spinner"></div>
    <span>Loading Interactive Desmos Graph...</span>
  </div>

  <!-- Error State -->
  <div class="graph-error" *ngIf="loadError">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span>Could not load Desmos graphing engine. Please check your internet connection.</span>
  </div>

  <!-- Desmos Container -->
  <div #calculatorContainer class="desmos-container"></div>
</div>
