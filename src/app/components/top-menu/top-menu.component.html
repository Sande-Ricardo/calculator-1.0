<div class="container00">
    <div class="brand-section">
      <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Toggle navigation menu">
        <svg class="hamburger-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <img src="assets/img/logo-w.png" alt="Calculato" class="top-logo" />
      <span class="brand-name">Calculato</span>
    </div>
    <ul class="right-menu">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">{{ 'NAVBAR.CALCULATOR' | translate }}</a></li>
        <li><a routerLink="/derivate" routerLinkActive="active">{{ 'NAVBAR.DERIVATIVES' | translate }}</a></li>
        <li><a routerLink="/integrate" routerLinkActive="active">{{ 'NAVBAR.INTEGRALS' | translate }}</a></li>
        <li class="lang-switch-container">
          <button class="lang-switch-btn" (click)="toggleLanguage()">
            {{ currentLang | uppercase }}
          </button>
        </li>
    </ul>
</div>
